[package]
name = "ehr-security"
version = "0.1.0"
edition = "2024"

[dependencies]
pgp = "0.21"
libp2p = { version = "0.57.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3.3"

[[test]]
name = "security-unit-test"
path = "tests/security-unit-test.rs"
