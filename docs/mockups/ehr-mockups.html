<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHR – makiety</title>
<style>
:root{
  --rail:#2c3438; --side:#5483b3; --side-active:#416690; --side-field:#7a9fc6;
  --white:#fff; --ink:#111; --muted:#666; --line:#d9d9d9; --block:#ebebeb;
  --blue:#2062f5; --navy:#14264a; --r:4px;
}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:#cfd6de;color:var(--ink);font:15px/1.4 Helvetica,Arial,sans-serif}
.top{max-width:1240px;margin:0 auto;padding:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top span{margin-right:8px;font-weight:bold}
.top button{border:1px solid #8f9aa6;background:#fff;padding:6px 12px;font:inherit;border-radius:var(--r);cursor:pointer}
.top button[aria-pressed="true"]{background:var(--rail);color:#fff;border-color:var(--rail)}
.stage{max-width:1240px;margin:0 auto 40px;padding:0 16px}
.app{display:grid;grid-template-columns:64px 250px 1fr;background:var(--white);min-height:680px;position:relative;border-radius:var(--r);overflow:hidden}
.rail{background:var(--rail);color:#cfd6dc;display:flex;flex-direction:column;align-items:center;padding:14px 4px;font-size:12px;text-align:center}
.rail b{color:#fff;font-size:15px;margin-bottom:auto}
.side{background:var(--side);color:#fff;padding:16px 14px;display:flex;flex-direction:column}
.side h2{margin:0 0 14px;font-size:17px}
.search{background:var(--side-field);color:#eaf1f8;padding:9px 12px;margin-bottom:18px;text-align:center;border-radius:var(--r)}
.side .lbl{display:flex;justify-content:space-between;color:#d3e0ee;font-size:16px;margin:6px 0 8px}
.item{padding:8px 10px;margin-bottom:2px;border-radius:var(--r)}
.item.on{background:var(--side-active);font-weight:bold}
.me{margin-top:auto;padding-top:14px;font-size:13px;color:#dbe6f1;border-top:1px solid rgba(255,255,255,.25)}
.me b{display:block;color:#fff;font-size:14px}
.main{display:grid;grid-template-columns:1fr 290px;min-width:0}
.col{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:baseline;padding:16px 24px;border-bottom:1px solid var(--line)}
.bar h3{margin:0;font-size:19px}
.bar small{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;padding:14px 24px 4px}
.btn{display:inline-block;border:1px solid #b9b9b9;background:#fff;padding:7px 14px;font:inherit;font-size:14px;border-radius:var(--r)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.list{padding:10px 24px 24px}
.block{background:var(--block);border-radius:var(--r);padding:6px 18px}
.row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #dcdcdc}
.row:last-child{border-bottom:0}
.row .name{flex:1;min-width:0}
.row .name b{display:block;font-size:14.5px}
.row .name span{font-size:12.5px;color:var(--muted)}
.row .date{font-size:13px;color:var(--muted);white-space:nowrap}
.row .acts{font-size:14px;white-space:nowrap}
.row .acts u{color:var(--blue);margin-left:14px;text-decoration:none;font-weight:bold}
.row.sel .name b{text-decoration:underline}
.panel{border-left:1px solid var(--line);padding:18px 20px}
.panel h4{margin:0 0 14px;font-size:15px}
.prev{height:140px;background:var(--block);border-radius:var(--r);padding:14px;color:#888;font-size:12px;margin-bottom:14px}
.prev i{display:block;height:6px;background:#d2d2d2;margin:9px 0}
dl{display:grid;grid-template-columns:80px 1fr;gap:6px 8px;font-size:13.5px;margin:0 0 16px}
dt{color:var(--muted)}dd{margin:0;word-break:break-all}
.perm{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.perm b{color:var(--ink)}
.login{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;min-height:680px}
.login .l{background:var(--side);display:flex;align-items:center;padding:0 38px}
.login .r{background:var(--navy)}
.card{background:#fff;border-radius:var(--r);padding:34px 38px;width:100%;max-width:520px}
.card h3{margin:0 0 20px;font-size:25px;color:#0d2150}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;margin-bottom:5px}
.f div{border:1px solid #b5bcc4;padding:10px 12px;color:#999;border-radius:var(--r)}
.roles{display:flex;gap:18px;margin:4px 0 18px;font-size:14.5px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;width:min(440px,100%);padding:24px;border-radius:var(--r)}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.modal label{display:block;margin:10px 0;font-size:14.5px}
.modal label small{display:block;margin-left:22px;color:var(--muted);font-size:12.5px}
.modal .end{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media (max-width:900px){
  .app{grid-template-columns:56px 1fr}.side{display:none}
  .main{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}
  .login{grid-template-columns:1fr}.login .r{display:none}
  .row .date{display:none}
}
</style>
</head>
<body>
<div class="top"><span>EHR – makiety</span>
  <button data-s="first" aria-pressed="false">1a Pierwsze uruchomienie</button>
  <button data-s="login" aria-pressed="false">1b Logowanie</button>
  <button data-s="doctor" aria-pressed="true">2 Lekarz</button>
  <button data-s="share" aria-pressed="false">3 Udostępnianie</button>
  <button data-s="patient" aria-pressed="false">4 Pacjent</button>
</div>
<div class="stage"><div class="app" id="app"></div></div>
<script>
const rail=`<div class="rail"><b>EHR</b>Wyloguj</div>`;
const row=(n,m,d,sel,acts)=>`<div class="row ${sel?'sel':''}"><div class="name"><b>${n}</b><span>${m}</span></div><div class="date">${d}</div><div class="acts">${acts}</div></div>`;
const docActs=`<u>Podgląd</u><u>Pobierz</u><u>Udostępnij</u><u>Edytuj</u>`;
const patActs=`<u>Podgląd</u><u>Pobierz</u>`;
const docSide=`<div class="side"><h2>Dokumentacja</h2><div class="search">Szukaj pacjenta</div>
<div class="lbl">Pacjenci <span>+</span></div>
<div class="item on">Jan Kowalski</div><div class="item">Anna Nowak</div><div class="item">Piotr Wiśniewski</div>
<div class="lbl" style="margin-top:18px">Widoki</div>
<div class="item">Udostępnione przeze mnie</div><div class="item">Zaszyfrowane</div>
<div class="me"><b>dr Anna Malinowska</b>Lekarz</div></div>`;
const patSide=`<div class="side"><h2>Dokumentacja</h2><div class="search">Szukaj dokumentu</div>
<div class="lbl">Moje dokumenty</div>
<div class="item on">Wszystkie</div><div class="item">Wyniki badań</div><div class="item">Obrazowe</div><div class="item">Wypisy i zalecenia</div>
<div class="me"><b>Jan Kowalski</b>Pacjent</div></div>`;
const panel=(role)=>`<aside class="panel"><h4>Morfologia krwi.pdf</h4>
<div class="prev"><i style="width:60%"></i><i></i><i style="width:85%"></i><i style="width:70%"></i>Podgląd dokumentu</div>
<dl><dt>Dodał</dt><dd>dr Anna Malinowska</dd><dt>Data</dt><dd>14.11.2026, 09:12 UTC</dd><dt>Rozmiar</dt><dd>218 KB</dd><dt>CID</dt><dd>bafkrei…hadq</dd><dt>Stan</dt><dd>zaszyfrowany</dd></dl>
<div class="perm">${role==='doctor'?'<b>Twoje uprawnienia:</b> podgląd, pobranie, udostępnianie, edycja.':'<b>Twoje uprawnienia:</b> podgląd i pobranie.'}</div></aside>`;
const docMain=`<div class="main"><div class="col">
<div class="bar"><h3>Jan Kowalski</h3><small>12 dokumentów · zmiana 14.11.2026</small></div>
<div class="tools"><span class="btn pri">Dodaj dokument</span><span class="btn">Udostępnij</span></div>
<div class="list"><div class="block">
${row('Morfologia krwi.pdf','218 KB','14.11.2026',true,docActs)}
${row('RTG klatki piersiowej.png','1,4 MB','10.11.2026',false,docActs)}
${row('Wypis ze szpitala.pdf','96 KB','02.11.2026',false,docActs)}
${row('Zalecenia po zabiegu.docx','41 KB','28.10.2026',false,docActs)}
${row('EKG spoczynkowe.pdf','530 KB','19.10.2026',false,docActs)}
</div></div></div>${panel('doctor')}</div>`;
const patMain=`<div class="main"><div class="col">
<div class="bar"><h3>Moje dokumenty</h3><small>tylko odczyt · 12 dokumentów</small></div>
<div class="list"><div class="block">
${row('Morfologia krwi.pdf','dr Anna Malinowska · 218 KB','14.11.2026',true,patActs)}
${row('RTG klatki piersiowej.png','dr Anna Malinowska · 1,4 MB','10.11.2026',false,patActs)}
${row('Wypis ze szpitala.pdf','Szpital Miejski · 96 KB','02.11.2026',false,patActs)}
${row('Zalecenia po zabiegu.docx','dr Anna Malinowska · 41 KB','28.10.2026',false,patActs)}
</div></div></div>${panel('patient')}</div>`;
const modal=`<div class="overlay"><div class="modal"><h3>Udostępnij dokument</h3><p>Morfologia krwi.pdf · 218 KB</p>
<div class="f"><label>Odbiorca</label><div style="color:#111">Jan Kowalski (pacjent)</div></div>
<p style="margin:0 0 6px">Pacjent może odczytać i pobrać ten dokument.</p>
<div class="f" style="margin-top:14px"><label>Dostęp ważny do (automatycznie: 5 lat)</label><div style="color:#111;background:#f4f4f4">18.11.2031 (UTC)</div></div>
<div class="end"><span class="btn">Anuluj</span><span class="btn pri">Udostępnij</span></div></div></div>`;
const first=`<div class="login"><div class="l"><div class="card"><h3>Utwórz profil</h3>
<p style="margin:-10px 0 18px;color:#666;font-size:13.5px">Przy pierwszym uruchomieniu aplikacja tworzy Twój klucz tożsamości. Hasło go chroni; po jego utracie klucza nie da się odzyskać.</p>
<div class="f"><label>Imię i nazwisko</label><div>Imię i nazwisko</div></div>
<div class="f"><label>Hasło</label><div>Hasło</div></div>
<div class="f"><label>Powtórz hasło</label><div>Powtórz hasło</div></div>
<span class="btn pri" style="margin-top:8px">Utwórz profil</span></div></div>
<div class="r"><svg viewBox="0 0 400 680" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">
<g stroke="#1f3a6e" stroke-width="1" fill="none"><path d="M0 40H400"/><path d="M0 80H400"/><path d="M0 120H400"/><path d="M0 160H400"/><path d="M0 200H400"/><path d="M0 240H400"/><path d="M0 280H400"/><path d="M0 320H400"/><path d="M0 360H400"/><path d="M0 400H400"/><path d="M0 440H400"/><path d="M0 480H400"/><path d="M0 520H400"/><path d="M0 560H400"/><path d="M0 600H400"/><path d="M0 640H400"/><path d="M40 0V680"/><path d="M80 0V680"/><path d="M120 0V680"/><path d="M160 0V680"/><path d="M200 0V680"/><path d="M240 0V680"/><path d="M280 0V680"/><path d="M320 0V680"/><path d="M360 0V680"/></g>
<path d="M170 170h60v60h60v60h-60v60h-60v-60h-60v-60h60z" fill="none" stroke="#3d62d8" stroke-width="2"/>
<path d="M0 500H110L128 500 144 450 164 550 186 410 208 520 224 500H400" fill="none" stroke="#8fb0ff" stroke-width="2.5"/>
<circle cx="186" cy="410" r="4" fill="#fff"/></svg></div></div>`;
const login=`<div class="login"><div class="l"><div class="card"><h3>Zaloguj się</h3>
<p style="margin:-10px 0 18px;color:#666;font-size:13.5px">Anna Malinowska</p>
<div class="f"><label>Hasło</label><div>Hasło</div></div>
<span class="btn pri" style="margin-top:8px">Zaloguj</span></div></div>
<div class="r"><svg viewBox="0 0 400 680" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">
<g stroke="#1f3a6e" stroke-width="1" fill="none"><path d="M0 40H400"/><path d="M0 80H400"/><path d="M0 120H400"/><path d="M0 160H400"/><path d="M0 200H400"/><path d="M0 240H400"/><path d="M0 280H400"/><path d="M0 320H400"/><path d="M0 360H400"/><path d="M0 400H400"/><path d="M0 440H400"/><path d="M0 480H400"/><path d="M0 520H400"/><path d="M0 560H400"/><path d="M0 600H400"/><path d="M0 640H400"/><path d="M40 0V680"/><path d="M80 0V680"/><path d="M120 0V680"/><path d="M160 0V680"/><path d="M200 0V680"/><path d="M240 0V680"/><path d="M280 0V680"/><path d="M320 0V680"/><path d="M360 0V680"/></g>
<path d="M170 170h60v60h60v60h-60v60h-60v-60h-60v-60h60z" fill="none" stroke="#3d62d8" stroke-width="2"/>
<path d="M0 500H110L128 500 144 450 164 550 186 410 208 520 224 500H400" fill="none" stroke="#8fb0ff" stroke-width="2.5"/>
<circle cx="186" cy="410" r="4" fill="#fff"/></svg></div></div>`;
const screens={first,login,doctor:rail+docSide+docMain,share:rail+docSide+docMain+modal,patient:rail+patSide+patMain};
const app=document.getElementById('app');
function show(s){app.innerHTML=screens[s];document.querySelectorAll('.top button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));}
document.querySelector('.top').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.s)};
show('doctor');
</script>
</body>
</html>
