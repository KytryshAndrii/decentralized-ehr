[workspace]
resolver = "3"
exclude = ["vendor"]

members = [
    "apps/ehr-cli",
    "apps/ehr-desktop",
    "crates/ipfs-cid",
    "crates/ipfs-store",
    "crates/ipfs-network",
    "crates/ipfs-bitswap",
    "crates/ipfs-unixfs",
    "crates/ehr-core",
    "crates/ehr-security",
    "test-runner",
]

# libp2p-stream 0.5.0-alpha gubi przychodzące strumienie przy serii (kanał o jednym miejscu).
# Kopia w vendor/ różni się jednym miejscem: INBOUND_STREAM_BACKLOG w src/shared.rs.
[patch.crates-io]
libp2p-stream = { path = "vendor/libp2p-stream" }

# Argon2 (hasło do kluczy) bez optymalizacji trwa kilka sekund na każde odblokowanie.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
