[workspace]
resolver = "3"
exclude = ["vendor"]

members = [
    "apps/ehr-cli",
    "apps/ehr-desktop",
    "crates/ipfs-cid",
    "crates/ipfs-store",
    "crates/ipfs-network",
    "crates/ipfs-bitswap",
    "crates/ipfs-unixfs",
    "crates/ehr-core",
    "crates/ehr-security",
    "test-runner",
]

# libp2p-stream 0.5.0-alpha drops incoming streams in a burst (a channel with one slot).
# The copy in vendor/ differs in one place: INBOUND_STREAM_BACKLOG in src/shared.rs.
[patch.crates-io]
libp2p-stream = { path = "vendor/libp2p-stream" }

# Argon2 (key password) without optimisation takes several seconds per unlock.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
